[project]
name = "openjarvis-voice"
version = "0.1.0"
description = "Browser-based Korean voice assistant with a JARVIS-style UI, local Ollama, edge-tts, and intent-routed domain handlers."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "OpenJarvis Voice contributors"}]
keywords = ["voice", "korean", "ollama", "jarvis", "edge-tts", "stt", "tts"]

dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "edge-tts>=7.0",
  "ddgs>=9.0",
  "lxml>=5.0",
]

[project.optional-dependencies]
# Optional offline STT for voice_chat.py CLI variant. Not needed for the
# browser UI (which uses webkitSpeechRecognition).
cli-stt = [
  "faster-whisper>=1.0",
  "sounddevice>=0.4",
  "soundfile>=0.12",
  "numpy>=1.26",
  "av>=12",
  # Windows-only CUDA runtime for ctranslate2 / faster-whisper:
  "nvidia-cublas-cu12; sys_platform == 'win32'",
  "nvidia-cudnn-cu12; sys_platform == 'win32'",
  "nvidia-cuda-nvrtc-cu12; sys_platform == 'win32'",
  "nvidia-cuda-runtime-cu12; sys_platform == 'win32'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Single-script project; nothing to package as a wheel by default.
bypass-selection = true
